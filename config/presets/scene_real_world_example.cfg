# Real-world tablet + cezve scene aligned with the calibrated camera pose
# from python/calibration/output/reference_pose.json.
#
# World frame = ChArUco board frame with z flipped so +z is up:
#   origin = board origin (top-left corner of the 10x6 ChArUco layout)
#   +x     = board +x (across the long board edge)
#   +y     = board +y (across the short board edge)
#   +z     = up out of the board plane, toward the camera
#
# The board itself occupies x in [0, 0.200], y in [0, 0.120] at z=0.
# The tablet screen is a larger plane that contains the board.

# Calibrated camera pose derived from reference_pose.json
# (board_to_camera rotation/translation, expressed in the world frame above).
lookfrom      = 0.392677, 0.068203, 0.193814
lookat        = 0.068009, 0.070519, 0.000000
vup           = -0.512478, 0.011606, 0.858622
# vfov from calibrated intrinsics: 2 * atan(image_height / (2 * fy))
#                                = 2 * atan(3024 / (2 * 3114.11)) ~= 51.78 deg
vfov          = 51.78
aspect_ratio  = 1.333333
focus_dist    = 0.40
defocus_angle = 0.0

# No synthetic ground or extra chrome ball.
ground_enabled = false
ball_enabled   = false
table_y        = 0.0

# Parametric cezve as a frustum, placed near the center of the visible board
# so it sits in the middle of the rendered view.
reflective_object_type = frustum
frustum_base_center    = 0.100000, 0.060000, 0.000000
frustum_bottom_radius  = 0.032500
frustum_top_radius     = 0.037500
frustum_height         = 0.090000
frustum_axis           = 0.000000, 0.000000, 1.000000

# Mirror-like metal approximation.
cylinder_albedo = 0.96, 0.96, 0.96
cylinder_fuzz   = 0.0
ground_albedo   = 0.90, 0.90, 0.90
photo_intensity = 1.0

# Photo plane = tablet screen surrounding the board.
# Span x in [-0.100, 0.300] (400 mm wide) and y in [-0.050, 0.200] (250 mm
# tall), large enough to fill the visible tablet area in the reference photo.
explicit_photo_plane_enabled = true
photo_plane_q = -0.100000, -0.050000, 0.000000
photo_plane_u =  0.400000,  0.000000, 0.000000
photo_plane_v =  0.000000,  0.250000, 0.000000

# Shrink the target image so all reflections land inside the photo plane,
# and shift the rect down so it covers the cezve's lower (wider) portion
# where reflections hit the tablet more directly.
target_rect_width_ratio  = 0.45
target_rect_height_ratio = -1.0
target_rect_offset_x     = 0.0
target_rect_offset_y     = 0.20
anamorphic_enabled       = true

# Paint the rest of the tablet (photo plane) solid magenta so the image
# region is clearly visible against a purple background.
photo_plane_solid_empty_background = true
