# Scene configuration for the anamorphic cylinder render.
# Vectors are comma-separated x, y, z. Lines starting with # are ignored.
# Missing keys fall back to defaults in include/raytracing/scene_config.h.
# Length units are meters; angles are degrees.

# ─── Camera ───
lookfrom      = 0.0, 1.0, 1.10
lookat        = 0.0, 0.07, 0.0
vup           = 0, 1, 0
vfov          = 30
aspect_ratio  = 1.777778
focus_dist    = 1.25
defocus_angle = 0.0

# ─── Geometry ───
# Table surface y. The ground sphere sits below this and the cylinder sits on it.
table_y         = 0.0

# Reflective object type: cylinder | mesh | pointcloud
reflective_object_type = cylinder

# Reflective cylinder.
cylinder_center = 0.0, 0.075, 0.0
cylinder_radius = 0.035
cylinder_height = 0.15
cylinder_axis   = 0, 1, 0

# Reflective mesh. The .norm format expects triangle vertices plus per-vertex
# normals, so reflections use barycentric-interpolated normals on the surface.
# mesh_file   = assets/models/utah_teapot_surface_22885.norm
# mesh_height = 0.09
# mesh_center = 0.0, 0.045, 0.0

# Reflective point cloud fallback. This renders each PLY vertex as a tiny
# sphere, so it behaves like a dense bead/splat surface rather than a perfectly
# continuous mirror.
# pointcloud_file = assets/pointclouds/glass.ply
# pointcloud_center = 0.0, 0.10, 0.0
# pointcloud_height = 0.20
# pointcloud_point_radius = 0.0035

# Chrome ball off to the side (set ball_enabled = false to remove it).
ball_enabled    = true
ball_center     = 0.13, 0.05, 0.0
ball_radius     = 0.05

# ─── Materials ───
# Albedo is (r, g, b) in 0..1. Fuzz=0 means a perfect mirror, 1 is fully diffuse.
cylinder_albedo = 0.95, 0.88, 0.72
cylinder_fuzz   = 0.0

ball_albedo     = 0.92, 0.92, 0.95
ball_fuzz       = 0.0

ground_albedo   = 0.55, 0.55, 0.55

# Multiplier on the anamorphic photo plane's emission.
photo_intensity = 1.0

# ─── Photo plane ───
# Padding added around the auto-fitted reflection bounding box (meters).
photo_plane_margin = 0.02
photo_plane_trim_fraction = 0.02

# Horizontal fraction of the cylinder's silhouette that the anamorphic image
# covers. The vertical extent is derived automatically from the target image's
# own aspect ratio so the picture isn't distorted.
target_rect_width_ratio  = 0.50

# Manual vertical override; negative = auto (recommended). Setting a value here
# stretches/squashes the image to fit that fraction.
# target_rect_height_ratio = -1.0

# When true, generated/photo.ppm is freshly generated for this run.
# When false, generation is skipped — but if generated/photo.ppm from a
# previous run exists on disk, it is still placed on the table as the quad's
# texture. Set both to false (above) AND delete generated/photo.ppm to render
# geometry only.
anamorphic_enabled = true
