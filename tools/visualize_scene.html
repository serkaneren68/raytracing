<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Anamorphic Scene Viewer</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
         background: #1a1a1a; color: #ddd; overflow: hidden; }
  #ui {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(28, 28, 32, 0.88);
    padding: 14px 16px; border-radius: 10px; max-width: 320px;
    border: 1px solid #444; backdrop-filter: blur(4px);
  }
  #ui h1 { margin: 0 0 6px 0; font-size: 14px; font-weight: 600; color: #f0e0a0; }
  #ui p  { margin: 4px 0; font-size: 11px; color: #999; }
  #ui button, #ui input[type=file] {
    background: #2a2a30; color: #ddd; border: 1px solid #555;
    padding: 5px 9px; border-radius: 4px; font-size: 11px;
    cursor: pointer; margin: 4px 4px 0 0;
  }
  #ui button:hover { background: #3a3a40; border-color: #777; }
  #info { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
          line-height: 1.5; margin-top: 8px; padding-top: 8px;
          border-top: 1px solid #444; color: #c8c8c8; }
  .legend { font-size: 11px; margin-top: 10px; padding-top: 8px;
            border-top: 1px solid #444; }
  .legend div { margin: 2px 0; }
  .legend span { display: inline-block; width: 12px; height: 12px;
                 border-radius: 2px; vertical-align: middle; margin-right: 6px;
                 border: 1px solid #666; }
  #status { font-size: 11px; color: #ff9090; margin-top: 6px; min-height: 14px; }
</style>
</head>
<body>
<div id="ui">
  <h1>🔮 Anamorphic Scene Viewer</h1>
  <p>Mouse: <b>drag</b> = rotate · <b>right-drag</b> = pan · <b>wheel</b> = zoom</p>
  <input type="file" id="file" accept=".cfg,.txt,.ini" />
  <button id="reset">Reset view</button>
  <button id="topdown">Top-down</button>
  <button id="camview">From camera</button>
  <div id="status"></div>
  <div id="info"></div>
  <div class="legend">
    <div><span style="background:#d0b878"></span> Cylinder (metal)</div>
    <div><span style="background:#c7c7d0"></span> Ball (chrome)</div>
    <div><span style="background:#ff3030"></span> Camera (lookfrom)</div>
    <div><span style="background:#3070ff"></span> Look-at point</div>
    <div><span style="background:#40c0ff"></span> Viewport / frustum</div>
    <div><span style="background:#30ff70"></span> vup direction</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ────── Defaults match scene_config.h ──────────────────────────────────
const DEFAULTS = {
  lookfrom:        [0.0, 0.55, 1.10],
  lookat:          [0.0, 0.07, 0.0],
  vup:             [0.0, 1.0, 0.0],
  vfov:            30.0,
  aspect_ratio:    16/9,
  focus_dist:      1.25,
  defocus_angle:   0.0,
  table_y:         0.0,
  cylinder_center: [0.0, 0.075, 0.0],
  cylinder_radius: 0.035,
  cylinder_height: 0.15,
  cylinder_axis:   [0.0, 1.0, 0.0],
  ball_enabled:    true,
  ball_center:     [0.13, 0.05, 0.0],
  ball_radius:     0.05,
  cylinder_albedo: [0.95, 0.88, 0.72],
  ball_albedo:     [0.92, 0.92, 0.95],
  photo_plane_margin: 0.02,
};

const VEC3_KEYS = new Set([
  'lookfrom', 'lookat', 'vup',
  'cylinder_center', 'cylinder_axis', 'ball_center',
  'cylinder_albedo', 'ball_albedo', 'ground_albedo',
]);
const BOOL_KEYS = new Set(['ball_enabled']);

function parseConfig(text) {
  const cfg = { ...DEFAULTS };
  for (const raw of text.split('\n')) {
    const noComment = raw.split('#')[0].trim();
    if (!noComment || !noComment.includes('=')) continue;
    const [k, ...rest] = noComment.split('=');
    const key = k.trim();
    const value = rest.join('=').trim();
    if (!(key in DEFAULTS)) continue;
    if (BOOL_KEYS.has(key)) {
      cfg[key] = ['true','yes','1','on'].includes(value.toLowerCase());
    } else if (VEC3_KEYS.has(key) || value.includes(',')) {
      cfg[key] = value.split(',').map(s => parseFloat(s.trim()));
    } else {
      cfg[key] = parseFloat(value);
    }
  }
  return cfg;
}

function arrToColor(arr) {
  const c = new THREE.Color(arr[0], arr[1], arr[2]);
  c.convertLinearToSRGB();
  return c;
}

// ────── Three.js setup ─────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x18181c);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const viewerCam = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.001, 100
);
viewerCam.position.set(0.9, 0.8, 1.5);

const controls = new OrbitControls(viewerCam, renderer.domElement);
controls.target.set(0, 0.07, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.05;
controls.maxDistance = 12;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(1.2, 1.8, 0.6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-1.2, 0.6, -1.0);
scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffd080, 0.25);
rim.position.set(0.0, 0.3, -1.2);
scene.add(rim);

// Volumetric 10 cm grid aligned to scene origin.
// Ranges are picked so 0 falls exactly on a grid line.
const GRID_STEP = 0.10;
const GRID_X = [-0.7, 0.7];     // 14 cells across
const GRID_Y = [ 0.0, 1.4];     // 14 cells up (Y=0 = table)
const GRID_Z = [-0.6, 1.4];     // 20 cells deep (camera at Z=1.10 fits)

function buildVolumetricGrid(xR, yR, zR, step, color, opacity) {
  const positions = [];
  const lineAt = (a, b, c, axis) => {
    // axis: 0=>X line at (y=a, z=b), 1=>Y line at (x=a, z=b), 2=>Z line at (x=a, y=b)
    if (axis === 0) positions.push(xR[0], a, b, xR[1], a, b);
    if (axis === 1) positions.push(a, yR[0], b, a, yR[1], b);
    if (axis === 2) positions.push(a, b, zR[0], a, b, zR[1]);
  };
  const eps = 1e-9;
  for (let y = yR[0]; y <= yR[1] + eps; y += step)
    for (let z = zR[0]; z <= zR[1] + eps; z += step) lineAt(y, z, null, 0);
  for (let x = xR[0]; x <= xR[1] + eps; x += step)
    for (let z = zR[0]; z <= zR[1] + eps; z += step) lineAt(x, z, null, 1);
  for (let x = xR[0]; x <= xR[1] + eps; x += step)
    for (let y = yR[0]; y <= yR[1] + eps; y += step) lineAt(x, y, null, 2);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',
    new THREE.BufferAttribute(new Float32Array(positions), 3));
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color, transparent: true, opacity, depthWrite: false,
  }));
}

// Faint full grid
scene.add(buildVolumetricGrid(GRID_X, GRID_Y, GRID_Z, GRID_STEP, 0x404048, 0.13));

// Brighter axis-zero planes for orientation: lines that touch X=0, Y=0, or Z=0.
function buildAxisZeroLines(xR, yR, zR, step, color, opacity) {
  const positions = [];
  const eps = 1e-9;
  // X=0 plane: lines in Y and Z directions at x=0
  for (let z = zR[0]; z <= zR[1] + eps; z += step) positions.push(0, yR[0], z, 0, yR[1], z);
  for (let y = yR[0]; y <= yR[1] + eps; y += step) positions.push(0, y, zR[0], 0, y, zR[1]);
  // Y=0 plane: lines in X and Z directions at y=0
  for (let z = zR[0]; z <= zR[1] + eps; z += step) positions.push(xR[0], 0, z, xR[1], 0, z);
  for (let x = xR[0]; x <= xR[1] + eps; x += step) positions.push(x, 0, zR[0], x, 0, zR[1]);
  // Z=0 plane: lines in X and Y directions at z=0
  for (let y = yR[0]; y <= yR[1] + eps; y += step) positions.push(xR[0], y, 0, xR[1], y, 0);
  for (let x = xR[0]; x <= xR[1] + eps; x += step) positions.push(x, yR[0], 0, x, yR[1], 0);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',
    new THREE.BufferAttribute(new Float32Array(positions), 3));
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color, transparent: true, opacity, depthWrite: false,
  }));
}
scene.add(buildAxisZeroLines(GRID_X, GRID_Y, GRID_Z, GRID_STEP, 0x7a7a8a, 0.45));

// Larger world-axis arrows at origin (X red, Y green, Z blue), 30 cm long.
scene.add(new THREE.AxesHelper(0.3));

// Tick labels at 10 cm intervals along each positive axis.
function makeLabel(text, color = '#cccccc') {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 32px ui-monospace, Menlo, monospace';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 32);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false,
  }));
  sprite.scale.set(0.10, 0.05, 1);
  return sprite;
}

// 10 cm tick labels along each axis, every 20 cm to keep things readable.
// X and Z have negative side too; Y is non-negative (table at y=0).
for (let i = -6; i <= 6; i += 2) {
  if (i === 0) continue;
  const cm = i * 10;
  const lab = makeLabel(`${cm}`, '#ff9090');
  lab.position.set(i * 0.1, 0.018, -0.02);
  scene.add(lab);
}
for (let i = 2; i <= 14; i += 2) {
  const cm = i * 10;
  const lab = makeLabel(`${cm}`, '#9bff9b');
  lab.position.set(-0.025, i * 0.1, 0.0);
  scene.add(lab);
}
for (let i = -6; i <= 14; i += 2) {
  if (i === 0) continue;
  const cm = i * 10;
  const lab = makeLabel(`${cm}`, '#9bb8ff');
  lab.position.set(-0.018, 0.018, i * 0.1);
  scene.add(lab);
}

const xName = makeLabel('+X', '#ff5050'); xName.position.set(0.78, 0.02, 0); scene.add(xName);
const yName = makeLabel('+Y', '#50ff50'); yName.position.set(0, 1.48, 0);    scene.add(yName);
const zName = makeLabel('+Z', '#5070ff'); zName.position.set(0, 0.02, 1.48); scene.add(zName);

// Scene root (everything cleared on reload)
const sceneGroup = new THREE.Group();
scene.add(sceneGroup);

let currentCfg = DEFAULTS;

function disposeObject(obj) {
  obj.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
      else child.material.dispose();
    }
  });
}

function clearGroup() {
  while (sceneGroup.children.length > 0) {
    const obj = sceneGroup.children[0];
    sceneGroup.remove(obj);
    disposeObject(obj);
  }
}

function buildScene(cfg) {
  clearGroup();
  currentCfg = cfg;

  // Table — translucent so the floor grid stays visible through it.
  const tableGeo = new THREE.PlaneGeometry(1.5, 1.5);
  const tableMat = new THREE.MeshStandardMaterial({
    color: 0x4a4a52, side: THREE.DoubleSide,
    metalness: 0.0, roughness: 0.85, transparent: true, opacity: 0.25,
  });
  const table = new THREE.Mesh(tableGeo, tableMat);
  table.rotation.x = -Math.PI / 2;
  table.position.y = cfg.table_y;
  sceneGroup.add(table);

  // Cylinder
  const cylGeo = new THREE.CylinderGeometry(
    cfg.cylinder_radius, cfg.cylinder_radius, cfg.cylinder_height, 48
  );
  const cylColor = cfg.cylinder_albedo ? arrToColor(cfg.cylinder_albedo) : new THREE.Color(0xd0b878);
  const cylMat = new THREE.MeshStandardMaterial({
    color: cylColor, metalness: 0.95, roughness: 0.08,
  });
  const cyl = new THREE.Mesh(cylGeo, cylMat);
  cyl.position.fromArray(cfg.cylinder_center);
  const axisV = new THREE.Vector3().fromArray(cfg.cylinder_axis).normalize();
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), axisV);
  sceneGroup.add(cyl);

  // Ball
  if (cfg.ball_enabled) {
    const ballGeo = new THREE.SphereGeometry(cfg.ball_radius, 40, 28);
    const ballColor = cfg.ball_albedo ? arrToColor(cfg.ball_albedo) : new THREE.Color(0xc7c7d0);
    const ballMat = new THREE.MeshStandardMaterial({
      color: ballColor, metalness: 0.95, roughness: 0.07,
    });
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.position.fromArray(cfg.ball_center);
    sceneGroup.add(ball);
  }

  // Camera marker
  const camMarker = new THREE.Mesh(
    new THREE.SphereGeometry(0.018, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xff3030 })
  );
  camMarker.position.fromArray(cfg.lookfrom);
  sceneGroup.add(camMarker);

  // Lookat marker
  const lookMarker = new THREE.Mesh(
    new THREE.SphereGeometry(0.010, 12, 10),
    new THREE.MeshBasicMaterial({ color: 0x3070ff })
  );
  lookMarker.position.fromArray(cfg.lookat);
  sceneGroup.add(lookMarker);

  // Camera → lookat dashed line
  const camLookLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3().fromArray(cfg.lookfrom),
      new THREE.Vector3().fromArray(cfg.lookat),
    ]),
    new THREE.LineDashedMaterial({ color: 0xff5555, dashSize: 0.04, gapSize: 0.025 })
  );
  camLookLine.computeLineDistances();
  sceneGroup.add(camLookLine);

  // Viewport rectangle + frustum
  const lookfrom = new THREE.Vector3().fromArray(cfg.lookfrom);
  const lookat   = new THREE.Vector3().fromArray(cfg.lookat);
  const vup      = new THREE.Vector3().fromArray(cfg.vup);

  const forward = lookat.clone().sub(lookfrom).normalize();
  const right   = new THREE.Vector3().crossVectors(forward, vup).normalize();
  const up      = new THREE.Vector3().crossVectors(right, forward);

  const vfovRad = cfg.vfov * Math.PI / 180;
  const vpH = 2 * cfg.focus_dist * Math.tan(vfovRad / 2);
  const vpW = vpH * cfg.aspect_ratio;

  const vpCenter = lookfrom.clone().add(forward.clone().multiplyScalar(cfg.focus_dist));
  const halfRight = right.clone().multiplyScalar(vpW / 2);
  const halfUp    = up.clone().multiplyScalar(vpH / 2);

  const tl = vpCenter.clone().sub(halfRight).add(halfUp);
  const tr = vpCenter.clone().add(halfRight).add(halfUp);
  const br = vpCenter.clone().add(halfRight).sub(halfUp);
  const bl = vpCenter.clone().sub(halfRight).sub(halfUp);

  // Translucent quad
  const vpGeo = new THREE.BufferGeometry();
  vpGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    tl.x, tl.y, tl.z,  tr.x, tr.y, tr.z,  br.x, br.y, br.z,
    tl.x, tl.y, tl.z,  br.x, br.y, br.z,  bl.x, bl.y, bl.z,
  ]), 3));
  vpGeo.computeVertexNormals();
  sceneGroup.add(new THREE.Mesh(vpGeo, new THREE.MeshBasicMaterial({
    color: 0x40c0ff, transparent: true, opacity: 0.18, side: THREE.DoubleSide,
  })));

  // Viewport outline
  sceneGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([tl, tr, br, bl, tl]),
    new THREE.LineBasicMaterial({ color: 0x40c0ff, linewidth: 2 })
  ));

  // Frustum (camera → 4 corners)
  const frustumMat = new THREE.LineBasicMaterial({
    color: 0x40c0ff, transparent: true, opacity: 0.5,
  });
  for (const corner of [tl, tr, br, bl]) {
    sceneGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([lookfrom, corner]),
      frustumMat
    ));
  }

  // vup arrow at camera
  sceneGroup.add(new THREE.ArrowHelper(
    new THREE.Vector3().fromArray(cfg.vup).normalize(),
    lookfrom, 0.12, 0x30ff70, 0.03, 0.02
  ));

  updateInfo(cfg, { center: vpCenter, w: vpW, h: vpH, tl, tr, bl, br });
}

function updateInfo(cfg, corners) {
  const f3 = v => `(${v.map(x => (+x).toFixed(3)).join(', ')})`;
  const vf3 = v => `(${v.x.toFixed(3)}, ${v.y.toFixed(3)}, ${v.z.toFixed(3)})`;
  document.getElementById('info').innerHTML = `
<b>lookfrom</b>  ${f3(cfg.lookfrom)}
<b>lookat</b>    ${f3(cfg.lookat)}
<b>vfov</b>      ${cfg.vfov.toFixed(1)}°  &nbsp;<b>focus</b> ${cfg.focus_dist.toFixed(2)}m
<b>cylinder</b>  ${f3(cfg.cylinder_center)}  r=${cfg.cylinder_radius}
<b>ball</b>      ${cfg.ball_enabled ? f3(cfg.ball_center) + '  r=' + cfg.ball_radius : 'disabled'}
<b>vp center</b> ${vf3(corners.center)}
<b>vp size</b>   ${corners.w.toFixed(3)} × ${corners.h.toFixed(3)} m
<b>vp TL</b>     ${vf3(corners.tl)}
<b>vp TR</b>     ${vf3(corners.tr)}
<b>vp BL</b>     ${vf3(corners.bl)}
<b>vp BR</b>     ${vf3(corners.br)}
`.replace(/\n/g, '<br>');
}

function status(msg, color = '#ff9090') {
  const el = document.getElementById('status');
  el.style.color = color;
  el.textContent = msg;
}

// ────── Initial load: try fetch, fall back to defaults ─────────────────
async function tryFetchDefault() {
  try {
    const resp = await fetch('config/default.cfg');
    if (resp.ok) {
      const text = await resp.text();
      buildScene(parseConfig(text));
      status('Loaded config/default.cfg from server.', '#90ff90');
      return;
    }
  } catch (e) { /* fall through */ }
  buildScene(DEFAULTS);
  status('Using built-in defaults. Pick a config file with the file button ->', '#ffc060');
}
tryFetchDefault();

// File picker
document.getElementById('file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    buildScene(parseConfig(ev.target.result));
    status(`Loaded ${file.name}.`, '#90ff90');
  };
  reader.readAsText(file);
});

// View buttons
document.getElementById('reset').addEventListener('click', () => {
  viewerCam.position.set(0.9, 0.8, 1.5);
  controls.target.fromArray(currentCfg.cylinder_center);
  controls.update();
});
document.getElementById('topdown').addEventListener('click', () => {
  viewerCam.position.set(0.001, 1.4, 0.001);
  controls.target.fromArray(currentCfg.cylinder_center);
  controls.update();
});
document.getElementById('camview').addEventListener('click', () => {
  viewerCam.position.fromArray(currentCfg.lookfrom);
  controls.target.fromArray(currentCfg.lookat);
  controls.update();
});

// Resize
window.addEventListener('resize', () => {
  viewerCam.aspect = window.innerWidth / window.innerHeight;
  viewerCam.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, viewerCam);
}
animate();
</script>
</body>
</html>
